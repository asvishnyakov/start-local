# Overlay of kibana-elasticsearch.yml: Kibana signs in to Elasticsearch over TLS, trusting the setup CA.
# The HTTPS host lives here, not in kibana.https.yml: kibana-elasticsearch.yml is listed after kibana.https.yml
# and would set it back to http.
services:

  kibana:
    environment:
      - ELASTICSEARCH_HOSTS=https://es:9200
      - ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES=config/certs/ca/ca.crt
