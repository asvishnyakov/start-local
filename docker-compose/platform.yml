# The Docker platform. Database, search, cache and storefront wiring comes from the platform-* link files.
services:

  vc-platform-web:
    image: vc-platform:${COMPOSE_PROJECT_NAME}-latest
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PLATFORM_PORT}:${PLATFORM_PORT}"
    environment:
      - ASPNETCORE_URLS=http://+:${PLATFORM_PORT}
      - VirtoCommerce__AllowInsecureHttp=true
      - VirtoCommerce__Hangfire__JobStorageType=Memory
      - Assets__FileSystem__PublicUrl=http://localhost:${PLATFORM_PORT}/assets/
      - Content__FileSystem__PublicUrl=http://localhost:${PLATFORM_PORT}/cms-content/
    # The modules come from the image, so a rebuild's modules always match its platform: Docker fills a named volume from
    # the image only while it is empty, so a modules volume kept the first build's modules through every rebuild.
    # Modules installed from the admin UI do not survive a new container, as in VirtoCloud.
    # Uploaded assets (catalog and page images, order documents) need a volume: stop removes the container.
    volumes:
      - cms-content-data:/opt/virtocommerce/platform/wwwroot/cms-content
      - assets-data:/opt/virtocommerce/platform/wwwroot/assets
    networks:
      - virto
    restart: unless-stopped
    healthcheck:
      # The official image has no curl: bash's /dev/tcp sends the request, and only "200" counts as healthy.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/${PLATFORM_PORT} && printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q '^HTTP/1\\.[01] 200 '"]
      interval: 10s
      timeout: 10s
      retries: 120

volumes:
  cms-content-data:
    name: ${VOLUME_PREFIX:-${COMPOSE_PROJECT_NAME}}_cms-content-data
  assets-data:
    name: ${VOLUME_PREFIX:-${COMPOSE_PROJECT_NAME}}_assets-data
