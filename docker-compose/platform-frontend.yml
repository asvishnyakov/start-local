# Link file, maintained by the scripts: the storefront proxies to the Docker platform.
services:

  vc-frontend:
    environment:
      - PLATFORM_UPSTREAM=vc-platform-web:${PLATFORM_PORT}
    # nginx resolves vc-platform-web once, at start: when Compose recreates or restarts the platform, it restarts the
    # storefront too, so a platform at a new address is not missed (or another container's taken for it).
    depends_on:
      vc-platform-web:
        condition: service_healthy
        restart: true
