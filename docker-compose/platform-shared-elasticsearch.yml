# Link file, maintained by the scripts: wires the platform to the shared Elasticsearch. The index prefix is the
# platform's own (SEARCH_SCOPE, S9), and no depends_on crosses projects (S4).
services:

  vc-platform-web:
    environment:
      - Search__Provider=${SEARCH_PROVIDER:-ElasticSearch8}
      - Search__${SEARCH_PROVIDER:-ElasticSearch8}__Server=http://es:9200
      - Search__${SEARCH_PROVIDER:-ElasticSearch8}__User=elastic
      - Search__${SEARCH_PROVIDER:-ElasticSearch8}__Key=${ELASTIC_PASSWORD:?ELASTIC_PASSWORD is empty in .env}
      - Search__Scope=${SEARCH_SCOPE:?SEARCH_SCOPE is empty in .env}
