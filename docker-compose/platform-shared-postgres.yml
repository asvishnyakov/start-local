# Link file, maintained by the scripts: wires the platform to the shared PostgreSQL. The database is the platform's own
# (DB_NAME, S9), and no depends_on crosses projects (S4).
services:

  vc-platform-web:
    environment:
      - DatabaseProvider=PostgreSql
      - ConnectionStrings__VirtoCommerce=User ID=postgres;Password=${DB_PASSWORD:?DB_PASSWORD is empty in .env};Host=vc-db;Port=5432;Database=${DB_NAME:?DB_NAME is empty in .env}
