# Probes what GitHub-hosted runners can run for start-local CI (decision G1).
# Runs when this file changes, or by hand once it is on the default branch.
name: runner-probe
on:
  push:
    paths: [.github/workflows/runner-probe.yml]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults: { run: { shell: bash } }
    steps:
      - name: Image + arch
        run: echo "ImageOS=$ImageOS ImageVersion=$ImageVersion arch=$(uname -m)"
      - name: docker version
        continue-on-error: true
        run: docker version
      - name: docker compose version
        continue-on-error: true
        run: docker compose version
      - name: daemon OSType
        continue-on-error: true
        run: docker info --format '{{.OSType}}/{{.Architecture}}'
      - name: hello-world
        continue-on-error: true
        run: docker run --rm hello-world
      - name: linux/amd64 container
        continue-on-error: true
        run: docker run --rm --platform linux/amd64 alpine uname -a
      - name: compose config without daemon
        continue-on-error: true
        run: |
          printf 'services:\n  a:\n    image: alpine\n    platform: linux/amd64\n' > probe-compose.yml
          DOCKER_HOST=tcp://127.0.0.1:1 docker compose -f probe-compose.yml config
      - name: pwsh + Pester
        shell: pwsh
        run: |
          pwsh -v
          Get-Module -ListAvailable Pester | Format-Table Name, Version, ModuleBase -AutoSize
          Import-Module Pester -MinimumVersion 5.0 -PassThru | Select-Object Name, Version
      - name: .NET SDKs
        run: dotnet --list-sdks
      - name: WSL status (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: wsl --status; wsl --list --verbose
      - name: Linux docker inside WSL2 (Windows, experimental)
        if: runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 10   # see actions/runner-images#14938 (WSL provisioning freezes)
        shell: pwsh
        run: |
          wsl --install -d Ubuntu-24.04 --no-launch
          wsl -d Ubuntu-24.04 -u root -- sh -c 'uname -a; apt-get update -qq && apt-get install -y -qq docker.io docker-compose-v2 >/dev/null; (dockerd >/tmp/dockerd.log 2>&1 &); sleep 15; docker info --format "{{.OSType}}"; docker run --rm hello-world'
      - name: Try colima (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        timeout-minutes: 15
        run: |
          sysctl kern.hv_support || true
          brew install colima docker docker-compose
          mkdir -p ~/.docker
          echo '{"cliPluginsExtraDirs":["'"$(brew --prefix)"'/lib/docker/cli-plugins"]}' > ~/.docker/config.json
          docker compose version
          colima start --cpu 3 --memory 6
          docker info --format '{{.OSType}}/{{.Architecture}}'
          docker run --rm hello-world
